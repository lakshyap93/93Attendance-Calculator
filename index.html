<head>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { bg: '#0B1220', card: '#111827', blue: '#2563EB', cyan: '#06B6D4', accent: '#10B981' },
          },
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'Outfit', 'Inter', '-apple-system', 'sans-serif'],
          },
          animation: {
            'float': 'float 9s ease-in-out infinite',
            'float2': 'float2 12s ease-in-out infinite',
            'orb-drift': 'orbDrift 20s ease-in-out infinite',
            'orb-drift2': 'orbDrift2 25s ease-in-out infinite',
            'fade-in-up': 'fadeInUp 0.65s cubic-bezier(0.34,1.56,0.64,1) both',
            'fade-in-down': 'fadeInDown 0.5s cubic-bezier(0.34,1.56,0.64,1) both',
            'scale-in': 'scaleIn 0.5s cubic-bezier(0.34,1.56,0.64,1) both',
            'slide-in-left': 'slideInLeft 0.55s cubic-bezier(0.34,1.56,0.64,1) both',
            'slide-in-right': 'slideInRight 0.55s cubic-bezier(0.34,1.56,0.64,1) both',
            'shimmer': 'shimmer 2.4s linear infinite',
            'gradient-shift': 'gradientShift 5s ease infinite',
          },
          keyframes: {
            float: { '0%,100%': { transform: 'translateY(0px) rotate(0deg)' }, '33%': { transform: 'translateY(-18px) rotate(1deg)' }, '66%': { transform: 'translateY(-8px) rotate(-1deg)' } },
            float2: { '0%,100%': { transform: 'translateY(0px)' }, '40%': { transform: 'translateY(14px)' }, '70%': { transform: 'translateY(-10px)' } },
            orbDrift: { '0%': { transform: 'translate(0,0) scale(1)' }, '25%': { transform: 'translate(80px,-60px) scale(1.08)' }, '50%': { transform: 'translate(50px,80px) scale(0.95)' }, '75%': { transform: 'translate(-40px,30px) scale(1.04)' }, '100%': { transform: 'translate(0,0) scale(1)' } },
            orbDrift2: { '0%': { transform: 'translate(0,0) scale(1)' }, '30%': { transform: 'translate(-60px,40px) scale(1.06)' }, '60%': { transform: 'translate(70px,-50px) scale(0.93)' }, '100%': { transform: 'translate(0,0) scale(1)' } },
            fadeInUp: { '0%': { opacity: '0', transform: 'translateY(32px) scale(0.96)' }, '100%': { opacity: '1', transform: 'translateY(0) scale(1)' } },
            fadeInDown: { '0%': { opacity: '0', transform: 'translateY(-24px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },
            scaleIn: { '0%': { opacity: '0', transform: 'scale(0.88)' }, '100%': { opacity: '1', transform: 'scale(1)' } },
            slideInLeft: { '0%': { opacity: '0', transform: 'translateX(-40px) scale(0.96)' }, '100%': { opacity: '1', transform: 'translateX(0) scale(1)' } },
            slideInRight: { '0%': { opacity: '0', transform: 'translateX(40px) scale(0.96)' }, '100%': { opacity: '1', transform: 'translateX(0) scale(1)' } },

    .theme-dark .brand-title {

    /* ORB BACKGROUNDS — AMBER / GOLD */
    .bg-orb-1 {

      height: 750px;

      background: radial-gradient(circle, rgba(245, 158, 11, 0.28) 0%, rgba(251, 146, 60, 0.12) 60%, transparent 100%);

    .bg-orb-2 {

      height: 750px;

      background: radial-gradient(circle, rgba(234, 88, 12, 0.22) 0%, rgba(245, 158, 11, 0.10) 60%, transparent 100%);

    /* SHIMMER BAR */
    .shimmer-bar {

    .shimmer-bar::after {

    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(245, 158, 11, 0.25);

    }

    .custom-scrollbar::-webkit-scrollbar-thumb:hover {

    /* DELAYS */

      animation-delay: .30s

      animation-delay: .50s

</head>

<body class="theme-dark min-h-screen custom-scrollbar antialiased relative">

  <div class="bg-orb-1 animate-orb-drift"></div>
  <div class="bg-orb-2 animate-orb-drift2"></div>
  <div class="bg-orb-3 animate-float2"></div>

  <div id="root" class="relative z-10"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function useAnimatedNumber(target, duration = 750) {
      const [display, setDisplay] = useState(target);
      const prevRef = useRef(target);
      const rafRef = useRef(null);
      useEffect(() => {
        const from = prevRef.current;
        const to = target;
        if (from === to) { setDisplay(to); return; }
        const start = performance.now();
        const tick = (now) => {
          const t = Math.min((now - start) / duration, 1);
          const ease = 1 - Math.pow(1 - t, 3);
          setDisplay(parseFloat((from + (to - from) * ease).toFixed(2)));
          if (t < 1) rafRef.current = requestAnimationFrame(tick);
          else { setDisplay(to); prevRef.current = to; }
        };
        rafRef.current = requestAnimationFrame(tick);
        return () => cancelAnimationFrame(rafRef.current);
      }, [target, duration]);
      return display;
    }

    function calculateStats(presentInput, totalInput, targetGoal = 75) {
      const present = Math.max(0, parseInt(presentInput) || 0);
      const total = Math.max(0, parseInt(totalInput) || 0);
      if (total === 0) return { pct: 0, safeBunks: 0, neededClasses: 0, status: 'neutral', present: 0, total: 0 };
      const actualPresent = Math.min(present, total);
      const pct = parseFloat(((actualPresent / total) * 100).toFixed(2));
      if (pct >= targetGoal) {
        const safe = Math.floor((100 * actualPresent - targetGoal * total) / targetGoal);
        return { pct, safeBunks: Math.max(0, safe), neededClasses: 0, status: 'safe', present: actualPresent, total };
      } else {
        const exactNeeded = Math.ceil((targetGoal * total - 100 * actualPresent) / (100 - targetGoal));
        return { pct, safeBunks: 0, neededClasses: Math.max(0, exactNeeded), status: 'risk', present: actualPresent, total };
      }
    }

    function AttendlyApp() {
      const [isDarkTheme, setIsDarkTheme] = useState(true);
      const [presentSlots, setPresentSlots] = useState('');
      const [totalSlots, setTotalSlots] = useState('');
      const [targetGoal, setTargetGoal] = useState(75);
      const [simBunks, setSimBunks] = useState(0);
      const [simAttends, setSimAttends] = useState(0);
      const [mounted, setMounted] = useState(false);

      useEffect(() => { setMounted(true); }, []);
      useEffect(() => { if (window.lucide) window.lucide.createIcons(); },
        [isDarkTheme, presentSlots, totalSlots, targetGoal, simBunks, simAttends, mounted]);

      const toggleTheme = () => {
        setIsDarkTheme(!isDarkTheme);
        document.body.className = `theme-${!isDarkTheme ? 'dark' : 'light'} min-h-screen custom-scrollbar antialiased relative`;
      };

      const stats = calculateStats(presentSlots, totalSlots, targetGoal);
      const animatedPct = useAnimatedNumber(stats.pct, 800);

      const updatePresent = (d) => {
        const c = parseInt(presentSlots) || 0;
        setPresentSlots(Math.max(0, Math.min(parseInt(totalSlots) || 999, c + d)).toString());
      };
      const updateTotal = (d) => {
        const c = parseInt(totalSlots) || 0;
        setTotalSlots(Math.max(0, c + d).toString());
      };

      const totalNum = parseInt(totalSlots) || 0;
      const presentNum = parseInt(presentSlots) || 0;
      const afterBunkTotal = totalNum + parseInt(simBunks || 0);
      const afterBunkPct = afterBunkTotal > 0 ? ((presentNum / afterBunkTotal) * 100).toFixed(2) : '0.00';
      const afterAttTotal = totalNum + parseInt(simAttends || 0);
      const afterAttPct = afterAttTotal > 0 ? (((presentNum + parseInt(simAttends || 0)) / afterAttTotal) * 100).toFixed(2) : '0.00';

      return (
        <div className={`min-h-screen flex flex-col justify-between transition-all duration-700 ${mounted ? 'opacity-100' : 'opacity-0'}`}>

          <nav className="sticky top-0 z-50 glass-navbar h-[80px] px-6 sm:px-12 flex items-center justify-between shadow-lg animate-fade-in-down">
            <div className="flex flex-col justify-center">
              <h1 className="brand-title text-[22px] sm:text-[28px] lg:text-[34px] font-[800] leading-none tracking-[-0.03em]">
                Attendance Calculator
              </h1>
            </div>
            <div className="flex items-center gap-3">
              <button
                onClick={toggleTheme}
                className="px-4 py-2.5 rounded-2xl bg-white/5 hover:bg-white/10 border border-white/10 text-xs font-bold flex items-center gap-2 shadow-sm hover:scale-105 hover:shadow-lg"
              >
                <i data-lucide={isDarkTheme ? "sun" : "moon"} className="w-4 h-4 text-amber-400"></i>
                <span className="hidden sm:inline">{isDarkTheme ? "Light Mode" : "Dark Mode"}</span>
              </button>
            </div>
          </nav>

          <main className="flex-1 max-w-5xl w-full mx-auto px-4 sm:px-8 py-6 sm:py-8 space-y-6">
            <div className="glass-card p-6 sm:p-10 rounded-[28px] space-y-8 shadow-2xl relative overflow-hidden animate-fade-in-up delay-200">

              <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 border-b border-white/10 pb-6 animate-fade-in-up delay-300">
                <div>
                  <h2 className="text-xl sm:text-2xl font-bold flex items-center gap-2">
                    <i data-lucide="target" className="w-6 h-6 text-cyan-400"></i> Target Attendance Goal
                  </h2>
                  <p className="text-xs sm:text-sm text-slate-400 mt-1">Select your college minimum percentage threshold</p>
                </div>
                <div className="flex gap-2.5 w-full sm:w-auto">
                  {[75, 80, 85, 90].map(goal => (
                    <button
                      key={goal}
                      onClick={() => setTargetGoal(goal)}
                      className={`goal-btn flex-1 sm:flex-none px-5 py-2.5 rounded-2xl text-xs sm:text-sm font-extrabold ${targetGoal === goal
                        ? 'goal-active bg-gradient-to-r from-amber-500 to-orange-400 text-white shadow-lg shadow-amber-500/30'
                        : 'bg-white/5 hover:bg-white/10 text-amber-200/60 hover:text-amber-100'
                        }`}
                    >{goal}%</button>
                  ))}
                </div>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 gap-6 sm:gap-8">
                <div className="space-y-2.5 animate-slide-in-left delay-400">
                  <div className="flex justify-between items-center text-xs sm:text-sm font-bold text-slate-400">
                    <span className="uppercase tracking-wider">Present Slots / Attended</span>
                    <span className="text-amber-400 font-mono">Attended</span>
                  </div>
                  <div className="relative flex items-center">
                    <button onClick={() => updatePresent(-1)} className="stepper-btn absolute left-2.5 z-10 w-[48px] h-[48px] rounded-[16px] font-extrabold text-2xl flex items-center justify-center shadow-md">&#8722;</button>
                    <input type="number" min="0" value={presentSlots} onChange={e => setPresentSlots(e.target.value)}
                      className="slot-input w-full h-[64px] rounded-[16px] py-3.5 px-16 text-center text-3xl sm:text-4xl font-black focus:outline-none font-mono tracking-tight" />
                    <button onClick={() => updatePresent(1)} className="stepper-btn absolute right-2.5 z-10 w-[48px] h-[48px] rounded-[16px] font-extrabold text-2xl flex items-center justify-center shadow-md">+</button>
                  </div>
                </div>
                <div className="space-y-2.5 animate-slide-in-right delay-400">
                  <div className="flex justify-between items-center text-xs sm:text-sm font-bold text-amber-200/60">
                    <span className="uppercase tracking-wider">Total Slots / Held</span>
                    <span className="text-orange-400 font-mono">Total Held</span>
                  </div>
                  <div className="relative flex items-center">
                    <button onClick={() => updateTotal(-1)} className="stepper-btn absolute left-2.5 z-10 w-[48px] h-[48px] rounded-[16px] font-extrabold text-2xl flex items-center justify-center shadow-md">&#8722;</button>
                    <input type="number" min="0" value={totalSlots} onChange={e => setTotalSlots(e.target.value)}
                      className="slot-input w-full h-[64px] rounded-[16px] py-3.5 px-16 text-center text-3xl sm:text-4xl font-black focus:outline-none font-mono tracking-tight" />
                    <button onClick={() => updateTotal(1)} className="stepper-btn absolute right-2.5 z-10 w-[48px] h-[48px] rounded-[16px] font-extrabold text-2xl flex items-center justify-center shadow-md">+</button>
                  </div>
                </div>
              </div>

              <div className="card-inner p-8 sm:p-10 rounded-[24px] space-y-6 shadow-inner relative overflow-hidden animate-scale-in delay-500">
                <div style={{
                  position: 'absolute', top: '-40px', right: '-40px', width: '200px', height: '200px', borderRadius: '50%',
                  background: stats.status === 'safe'
                    ? 'radial-gradient(circle,rgba(245,158,11,0.22) 0%,transparent 70%)'
                    : 'radial-gradient(circle,rgba(239,68,68,0.14) 0%,transparent 70%)',
                  filter: 'blur(30px)', pointerEvents: 'none', transition: 'background 0.8s ease'
                }}></div>

                <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-6">
                  <div className="hero-pct-wrapper">
                    <span className="text-xs uppercase font-extrabold tracking-widest text-slate-400 block mb-1">Calculated Attendance</span>
                    <div className="text-6xl sm:text-7xl lg:text-8xl font-[900] tracking-[-0.04em] leading-none hero-pct my-1">
                      {animatedPct}%
                    </div>
                    <div className="text-lg sm:text-xl font-bold text-slate-300 mt-2 font-mono">
                      {stats.present} / {stats.total} Classes Attended
                    </div>
                  </div>
                  <div>
                    <span className={`status-badge px-5 py-2.5 rounded-full text-xs sm:text-sm font-black tracking-wider uppercase flex items-center gap-2 border ${stats.status === 'safe'
                      ? 'bg-amber-500/20 text-amber-400 border-amber-500/40 shadow-xl shadow-amber-500/20'
                      : 'bg-red-500/20 text-red-400 border-red-500/40 shadow-xl shadow-red-500/20 animate-pulse'
                      }`}>
                      {stats.status === 'safe' ? '✅ SAFE ZONE' : '⚠️ LOW ATTENDANCE'}
                    </span>
                  </div>
                </div>

                <div className="w-full bg-stone-900/80 rounded-full h-5 overflow-hidden p-[3px] border border-amber-500/10 shadow-inner">
                  <div
                    className={`progress-fill h-full shimmer-bar ${stats.pct >= targetGoal
                      ? 'bg-gradient-to-r from-amber-500 via-yellow-400 to-orange-400 shadow-lg shadow-amber-500/50'
                      : 'bg-gradient-to-r from-red-600 via-rose-500 to-orange-500 shadow-lg shadow-red-500/50'
                      }`}
                    style={{ width: `${Math.min(100, stats.pct)}%` }}
                  ></div>
                </div>

                <div className={`p-5 sm:p-6 rounded-[20px] border flex items-center justify-between text-sm sm:text-base transition-all duration-700 ${stats.status === 'safe' ? 'bg-amber-500/10 border-amber-500/25' : 'bg-red-500/10 border-red-500/25'
                  }`}>
                  {stats.status === 'safe' ? (
                    <div className="flex items-center gap-4 text-amber-400 font-semibold">
                      <div className="w-12 h-12 rounded-2xl bg-amber-500/20 border border-amber-500/30 flex items-center justify-center shrink-0 shadow-lg">
                        <i data-lucide="shield-check" className="w-6 h-6"></i>
                      </div>
                      <div>
                        <div className="text-base sm:text-lg font-bold text-white">
                          You have <span className="text-amber-400 text-xl font-black">{stats.safeBunks} safe bunks</span> left!
                        </div>
                        <div className="text-xs sm:text-sm text-amber-200/50 font-normal mt-0.5">
                          You can safely miss the next {stats.safeBunks} classes and stay above your {targetGoal}% goal.
                        </div>
                      </div>
                    </div>
                  ) : (
                    <div className="flex items-center gap-4 text-red-400 font-semibold">
                      <div className="w-12 h-12 rounded-2xl bg-red-500/20 border border-red-500/30 flex items-center justify-center shrink-0 shadow-lg">
                        <i data-lucide="alert-triangle" className="w-6 h-6"></i>
                      </div>
                      <div>
                        <div className="text-base sm:text-lg font-bold text-white">
                          Attend <span className="text-red-400 text-xl font-black">{stats.neededClasses} consecutive classes</span>!
                        </div>
                        <div className="text-xs sm:text-sm text-amber-200/50 font-normal mt-0.5">
                          Required to bring your attendance back up to the {targetGoal}% target threshold.
                        </div>
                      </div>
                    </div>
                  )}
                </div>
              </div>

              <div className="pt-4 border-t border-white/10 space-y-4 animate-fade-in-up delay-600">
                <h3 className="text-base font-bold flex items-center gap-2">
                  <i data-lucide="sliders" className="w-5 h-5 text-amber-400"></i> What-If Bunk Simulator
                </h3>
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 sm:gap-6">
                  <div className="sim-card p-5 rounded-[20px] bg-white/5 border border-amber-500/15 space-y-3 hover:border-amber-500/40 hover:shadow-lg hover:shadow-amber-500/10">
                    <div className="flex justify-between items-center text-xs sm:text-sm">
                      <span className="font-bold text-amber-200/70">If you BUNK next N classes:</span>
                      <div className="flex items-center gap-1.5">
                        <button onClick={() => setSimBunks(Math.max(0, parseInt(simBunks) - 1))} className="stepper-btn w-7 h-7 rounded-xl font-bold text-xs flex items-center justify-center">&#8722;</button>
                        <span className="px-2 font-mono font-bold text-amber-400 text-sm min-w-[24px] text-center">{simBunks}</span>
                        <button onClick={() => setSimBunks(parseInt(simBunks) + 1)} className="stepper-btn w-7 h-7 rounded-xl font-bold text-xs flex items-center justify-center">+</button>
                      </div>
                    </div>
                    <div className="flex items-baseline justify-between text-xs sm:text-sm pt-2 border-t border-amber-500/10">
                      <span className="text-amber-200/50">New Attendance %:</span>
                      <span className={`text-xl font-black transition-all duration-400 ${parseFloat(afterBunkPct) >= targetGoal ? 'text-amber-400' : 'text-red-400'}`}>
                        {afterBunkPct}%
                      </span>
                    </div>
                  </div>
                  <div className="sim-card p-5 rounded-[20px] bg-white/5 border border-orange-500/15 space-y-3 hover:border-orange-500/40 hover:shadow-lg hover:shadow-orange-500/10">
                    <div className="flex justify-between items-center text-xs sm:text-sm">
                      <span className="font-bold text-amber-200/70">If you ATTEND next N classes:</span>
                      <div className="flex items-center gap-1.5">
                        <button onClick={() => setSimAttends(Math.max(0, parseInt(simAttends) - 1))} className="stepper-btn w-7 h-7 rounded-xl font-bold text-xs flex items-center justify-center">&#8722;</button>
                        <span className="px-2 font-mono font-bold text-orange-400 text-sm min-w-[24px] text-center">{simAttends}</span>
                        <button onClick={() => setSimAttends(parseInt(simAttends) + 1)} className="stepper-btn w-7 h-7 rounded-xl font-bold text-xs flex items-center justify-center">+</button>
                      </div>
                    </div>
                    <div className="flex items-baseline justify-between text-xs sm:text-sm pt-2 border-t border-amber-500/10">
                      <span className="text-amber-200/50">New Attendance %:</span>
                      <span className="text-xl font-black text-orange-400">{afterAttPct}%</span>
                    </div>
                  </div>
                </div>
              </div>

            </div>
          </main>

          <footer className="glass-navbar border-t py-6 px-6 text-center text-xs sm:text-sm text-slate-400 font-medium mt-8 animate-fade-in-up delay-700">
            &copy; 2026 | 93Attendance-Calculator &bull; Designed and Developed by <a href="https://github.com/lakshyap93" target="_blank" rel="noopener noreferrer" className="font-extrabold brand-title hover:opacity-80 hover:tracking-wide">Lakshya Purohit</a>
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<AttendlyApp />);
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('[PWA] Service Worker registered:', reg.scope))
          .catch(err => console.warn('[PWA] Service Worker registration failed:', err));
      });
    }
  </script>
</body>

</html>
