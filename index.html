<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Attendance Calculator</title>
  <meta name="description" content="Smart Attendance Calculator — Track, Calculate, Stay Ahead. Works offline." />

  <!-- PWA Manifest & Icons -->
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />

  <!-- PWA Meta Tags -->
  <meta name="theme-color" content="#2563EB" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Attendance" />
  <meta name="application-name" content="Attendance Calculator" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              bg: '#0B1220',
              card: '#111827',
              blue: '#2563EB',
              cyan: '#06B6D4',
              accent: '#10B981',
            },
          },
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'Outfit', 'Inter', '-apple-system', 'sans-serif'],
          },
          animation: {
            'float': 'float 8s ease-in-out infinite',
          },
          keyframes: {
            float: {
              '0%, 100%': { transform: 'translateY(0px)' },
              '50%': { transform: 'translateY(-12px)' },
            }
          }
        },
      },
    };
  </script>

  <!-- Google Fonts: Plus Jakarta Sans & Outfit -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Outfit:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- React 18 & Babel CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    html {
      scroll-behavior: smooth;
    }
    body {
      font-family: 'Plus Jakarta Sans', 'Outfit', sans-serif;
      background-color: #0B1220;
      color: #F8FAFC;
      transition: background 0.5s cubic-bezier(0.4,0,0.2,1), color 0.5s cubic-bezier(0.4,0,0.2,1);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    * {
      transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* GLASSMORPHISM & CARD STYLES */
    .theme-dark {
      background-color: #0B1220;
      color: #F8FAFC;
    }
    .theme-dark .glass-navbar {
      background: rgba(11, 18, 32, 0.88);
      backdrop-filter: blur(32px) saturate(180%);
      -webkit-backdrop-filter: blur(32px) saturate(180%);
      border-bottom: 1.5px solid rgba(255, 255, 255, 0.1);
      transition: all 0.4s cubic-bezier(0.4,0,0.2,1);
    }
    .theme-dark .glass-card {
      background: rgba(17, 24, 39, 0.9);
      backdrop-filter: blur(32px) saturate(180%);
      -webkit-backdrop-filter: blur(32px) saturate(180%);
      border: 1.5px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 32px 80px -16px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255,255,255,0.04) inset;
      transition: box-shadow 0.4s cubic-bezier(0.4,0,0.2,1), transform 0.4s cubic-bezier(0.4,0,0.2,1);
    }
    .theme-dark .glass-card:hover {
      box-shadow: 0 40px 100px -20px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255,255,255,0.06) inset;
    }
    .theme-dark .brand-title {
      background: linear-gradient(135deg, #2563EB 0%, #06B6D4 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .theme-dark .hero-pct {
      background: linear-gradient(135deg, #2563EB 0%, #06B6D4 50%, #10B981 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .theme-dark .card-inner {
      background: rgba(11, 18, 32, 0.65);
      border: 1.5px solid rgba(255, 255, 255, 0.09);
      transition: all 0.4s cubic-bezier(0.4,0,0.2,1);
    }
    .theme-dark .slot-input {
      background-color: rgba(11, 18, 32, 0.85);
      border: 2.5px solid rgba(255, 255, 255, 0.14);
      color: #FFFFFF;
      transition: border-color 0.3s cubic-bezier(0.4,0,0.2,1), box-shadow 0.3s cubic-bezier(0.4,0,0.2,1), transform 0.2s cubic-bezier(0.4,0,0.2,1);
    }
    .theme-dark .slot-input:focus {
      border-color: #06B6D4;
      box-shadow: 0 0 0 4px rgba(6, 182, 212, 0.18), 0 0 30px rgba(6, 182, 212, 0.3);
      transform: scale(1.01);
    }
    .theme-dark .stepper-btn {
      background: rgba(255, 255, 255, 0.09);
      color: #FFFFFF;
      border: 1.5px solid rgba(255, 255, 255, 0.14);
      font-weight: 900;
      transition: background 0.25s cubic-bezier(0.4,0,0.2,1), border-color 0.25s cubic-bezier(0.4,0,0.2,1), transform 0.2s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.25s cubic-bezier(0.4,0,0.2,1);
    }
    .theme-dark .stepper-btn:hover {
      background: rgba(6, 182, 212, 0.2);
      border-color: rgba(6, 182, 212, 0.5);
      box-shadow: 0 0 20px rgba(6, 182, 212, 0.25);
      transform: scale(1.08);
    }
    .theme-dark .stepper-btn:active {
      transform: scale(0.93);
    }

    /* LIGHT THEME */
    .theme-light {
      background-color: #F1F5F9;
      color: #0F172A;
    }
    .theme-light .glass-navbar {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(32px) saturate(180%);
      -webkit-backdrop-filter: blur(32px) saturate(180%);
      border-bottom: 1.5px solid #E2E8F0;
      transition: all 0.4s cubic-bezier(0.4,0,0.2,1);
    }
    .theme-light .glass-card {
      background: #FFFFFF;
      backdrop-filter: none;
      border: 1.5px solid #E2E8F0;
      box-shadow: 0 25px 60px -12px rgba(0, 0, 0, 0.1), 0 0 0 1px rgba(0,0,0,0.02) inset;
      transition: box-shadow 0.4s cubic-bezier(0.4,0,0.2,1);
    }
    .theme-light .glass-card:hover {
      box-shadow: 0 35px 80px -16px rgba(0, 0, 0, 0.14);
    }
    .theme-light .brand-title {
      background: linear-gradient(135deg, #1D4ED8 0%, #0284C7 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .theme-light .hero-pct {
      background: linear-gradient(135deg, #1D4ED8 0%, #0284C7 50%, #059669 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .theme-light .text-slate-400,
    .theme-light .text-slate-300 {
      color: #475569 !important;
    }
    .theme-light .text-white {
      color: #0F172A !important;
    }
    .theme-light .card-inner {
      background: #F8FAFC;
      border: 1.5px solid #CBD5E1;
    }
    .theme-light .slot-input {
      background-color: #FFFFFF;
      border: 2.5px solid #CBD5E1;
      color: #0F172A !important;
      transition: border-color 0.3s cubic-bezier(0.4,0,0.2,1), box-shadow 0.3s cubic-bezier(0.4,0,0.2,1), transform 0.2s cubic-bezier(0.4,0,0.2,1);
    }
    .theme-light .slot-input:focus {
      border-color: #0284C7;
      box-shadow: 0 0 0 4px rgba(2, 132, 199, 0.15), 0 0 24px rgba(2, 132, 199, 0.2);
      transform: scale(1.01);
    }
    .theme-light .stepper-btn {
      background: #E2E8F0;
      color: #0F172A !important;
      border: 1.5px solid #CBD5E1;
      font-weight: 900;
      transition: background 0.25s cubic-bezier(0.4,0,0.2,1), border-color 0.25s cubic-bezier(0.4,0,0.2,1), transform 0.2s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.25s cubic-bezier(0.4,0,0.2,1);
    }
    .theme-light .stepper-btn:hover {
      background: #BFDBFE;
      border-color: #93C5FD;
      box-shadow: 0 0 16px rgba(37, 99, 235, 0.2);
      transform: scale(1.08);
    }
    .theme-light .stepper-btn:active {
      transform: scale(0.93);
    }
    .theme-light .bg-white\/5 {
      background-color: #F8FAFC !important;
      border-color: #CBD5E1 !important;
    }

    /* AMBIENT BACKGROUND GLOW ORBS */
    .bg-orb-1 {
      position: fixed;
      width: 700px;
      height: 700px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(37, 99, 235, 0.28) 0%, rgba(6, 182, 212, 0.12) 60%, transparent 100%);
      top: -180px;
      left: -180px;
      filter: blur(100px);
      pointer-events: none;
      z-index: 0;
    }
    .bg-orb-2 {
      position: fixed;
      width: 700px;
      height: 700px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.22) 0%, rgba(37, 99, 235, 0.1) 60%, transparent 100%);
      bottom: -180px;
      right: -180px;
      filter: blur(100px);
      pointer-events: none;
      z-index: 0;
    }

    /* SMOOTH PROGRESS BAR */
    .progress-bar-fill {
      transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* SMOOTH BUTTON BASE */
    button {
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
    }

    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(100, 116, 139, 0.4);
      border-radius: 9999px;
    }
  </style>

</head>
<body class="theme-dark min-h-screen custom-scrollbar antialiased relative">
  
  <!-- AMBIENT ORB LIGHTING -->
  <div class="bg-orb-1 animate-float"></div>
  <div class="bg-orb-2 animate-float" style="animation-delay: 3s;"></div>

  <div id="root" class="relative z-10"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function calculateStats(presentInput, totalInput, targetGoal = 75) {
      const present = Math.max(0, parseInt(presentInput) || 0);
      const total = Math.max(0, parseInt(totalInput) || 0);

      if (total === 0) {
        return { pct: 0, safeBunks: 0, neededClasses: 0, status: 'neutral', present: 0, total: 0 };
      }

      const actualPresent = Math.min(present, total);
      const pct = parseFloat(((actualPresent / total) * 100).toFixed(1));

      if (pct >= targetGoal) {
        const safe = Math.floor((100 * actualPresent - targetGoal * total) / targetGoal);
        return { pct, safeBunks: Math.max(0, safe), neededClasses: 0, status: 'safe', present: actualPresent, total };
      } else {
        const exactNeeded = Math.ceil((targetGoal * total - 100 * actualPresent) / (100 - targetGoal));
        return { pct, safeBunks: 0, neededClasses: Math.max(0, exactNeeded), status: 'risk', present: actualPresent, total };
      }
    }

    function AttendlyApp() {
      const [isDarkTheme, setIsDarkTheme] = useState(true);
      const [presentSlots, setPresentSlots] = useState('32');
      const [totalSlots, setTotalSlots] = useState('40');
      const [targetGoal, setTargetGoal] = useState(75);

      // What-If Simulator states
      const [simBunks, setSimBunks] = useState(2);
      const [simAttends, setSimAttends] = useState(3);

      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      }, [isDarkTheme, presentSlots, totalSlots, targetGoal, simBunks, simAttends]);

      const toggleTheme = () => {
        setIsDarkTheme(!isDarkTheme);
        document.body.className = `theme-${!isDarkTheme ? 'dark' : 'light'} min-h-screen custom-scrollbar antialiased relative`;
      };

      const stats = calculateStats(presentSlots, totalSlots, targetGoal);

      const updatePresent = (delta) => {
        const current = parseInt(presentSlots) || 0;
        const nextVal = Math.max(0, Math.min(parseInt(totalSlots) || 999, current + delta));
        setPresentSlots(nextVal.toString());
      };

      const updateTotal = (delta) => {
        const current = parseInt(totalSlots) || 0;
        const nextVal = Math.max(0, current + delta);
        setTotalSlots(nextVal.toString());
      };

      const applyPreset = (p, t) => {
        setPresentSlots(p.toString());
        setTotalSlots(t.toString());
        if (window.confetti) window.confetti({ particleCount: 40, spread: 60, origin: { y: 0.8 } });
      };

      const totalNum = parseInt(totalSlots) || 0;
      const presentNum = parseInt(presentSlots) || 0;

      const afterBunkTotal = totalNum + parseInt(simBunks || 0);
      const afterBunkPct = afterBunkTotal > 0 ? ((presentNum / afterBunkTotal) * 100).toFixed(1) : '0';

      const afterAttendTotal = totalNum + parseInt(simAttends || 0);
      const afterAttendPresent = presentNum + parseInt(simAttends || 0);
      const afterAttendPct = afterAttendTotal > 0 ? ((afterAttendPresent / afterAttendTotal) * 100).toFixed(1) : '0';

      return (
        <div class="min-h-screen flex flex-col justify-between">
          
          {/* 80PX NAVBAR WITH NAME & TAGLINE ONLY (NO LOGO IMAGE) */}
          <nav class="sticky top-0 z-50 glass-navbar h-[80px] px-6 sm:px-12 flex items-center justify-between shadow-lg">
            
            {/* BRAND NAME */}
            <div class="flex flex-col justify-center">
              <h1 class="brand-title text-[22px] sm:text-[28px] lg:text-[34px] font-[800] leading-none tracking-[-0.03em]">
                Attendance Calculator
              </h1>
            </div>

            {/* RIGHT CONTROLS */}
            <div class="flex items-center gap-3">
              <button
                onClick={toggleTheme}
                class="px-4 py-2.5 rounded-2xl bg-white/5 hover:bg-white/10 border border-white/10 text-xs font-bold transition flex items-center gap-2 shadow-sm"
              >
                <i data-lucide={isDarkTheme ? "sun" : "moon"} class="w-4 h-4 text-amber-400"></i>
                <span class="hidden sm:inline">{isDarkTheme ? "Light Mode" : "Dark Mode"}</span>
              </button>
            </div>
          </nav>

          {/* MAIN CONTENT AREA */}
          <main class="flex-1 max-w-5xl w-full mx-auto px-4 sm:px-8 py-6 sm:py-8 space-y-6">
            
            {/* CALCULATOR MAIN CARD */}
            <div class="glass-card p-6 sm:p-10 rounded-[24px] space-y-8 shadow-2xl relative overflow-hidden transition-all duration-300">
              
              {/* TARGET GOAL SELECTOR */}
              <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 border-b border-white/10 pb-6">
                <div>
                  <h2 class="text-xl sm:text-2xl font-bold flex items-center gap-2">
                    <i data-lucide="target" class="w-6 h-6 text-cyan-400"></i> Target Attendance Goal
                  </h2>
                  <p class="text-xs sm:text-sm text-slate-400 mt-1">Select your college minimum percentage threshold</p>
                </div>

                <div class="flex gap-2.5 w-full sm:w-auto">
                  {[75, 80, 85, 90].map(goal => (
                    <button
                      key={goal}
                      onClick={() => setTargetGoal(goal)}
                      class={`flex-1 sm:flex-none px-5 py-2.5 rounded-2xl text-xs sm:text-sm font-extrabold transition-all duration-300 ${
                        targetGoal === goal
                          ? 'bg-gradient-to-r from-blue-600 to-cyan-500 text-white shadow-lg shadow-blue-500/30 scale-105 ring-2 ring-cyan-400/50'
                          : 'bg-white/5 hover:bg-white/10 text-slate-400'
                      }`}
                    >
                      {goal}%
                    </button>
                  ))}
                </div>
              </div>

              {/* INPUT SLOTS GRID WITH 56PX HIGH INPUTS & 48PX STEPPERS */}
              <div class="grid grid-cols-1 md:grid-cols-2 gap-6 sm:gap-8">
                
                {/* PRESENT SLOTS INPUT */}
                <div class="space-y-2.5">
                  <div class="flex justify-between items-center text-xs sm:text-sm font-bold text-slate-400">
                    <span class="uppercase tracking-wider">Present Slots / Attended</span>
                    <span class="text-emerald-400 font-mono">Attended</span>
                  </div>

                  <div class="relative flex items-center">
                    <button
                      onClick={() => updatePresent(-1)}
                      class="stepper-btn absolute left-2.5 z-10 w-[48px] h-[48px] rounded-[16px] font-extrabold text-2xl active:scale-95 transition-all duration-200 flex items-center justify-center shadow-md"
                    >
                      -
                    </button>

                    <input
                      type="number"
                      min="0"
                      value={presentSlots}
                      onChange={e => setPresentSlots(e.target.value)}
                      class="slot-input w-full h-[64px] rounded-[16px] py-3.5 px-16 text-center text-3xl sm:text-4xl font-black focus:outline-none transition-all font-mono tracking-tight"
                      placeholder="32"
                    />

                    <button
                      onClick={() => updatePresent(1)}
                      class="stepper-btn absolute right-2.5 z-10 w-[48px] h-[48px] rounded-[16px] font-extrabold text-2xl active:scale-95 transition-all duration-200 flex items-center justify-center shadow-md"
                    >
                      +
                    </button>
                  </div>
                </div>

                {/* TOTAL SLOTS INPUT */}
                <div class="space-y-2.5">
                  <div class="flex justify-between items-center text-xs sm:text-sm font-bold text-slate-400">
                    <span class="uppercase tracking-wider">Total Slots / Held</span>
                    <span class="text-cyan-400 font-mono">Total Held</span>
                  </div>

                  <div class="relative flex items-center">
                    <button
                      onClick={() => updateTotal(-1)}
                      class="stepper-btn absolute left-2.5 z-10 w-[48px] h-[48px] rounded-[16px] font-extrabold text-2xl active:scale-95 transition-all duration-200 flex items-center justify-center shadow-md"
                    >
                      -
                    </button>

                    <input
                      type="number"
                      min="0"
                      value={totalSlots}
                      onChange={e => setTotalSlots(e.target.value)}
                      class="slot-input w-full h-[64px] rounded-[16px] py-3.5 px-16 text-center text-3xl sm:text-4xl font-black focus:outline-none transition-all font-mono tracking-tight"
                      placeholder="40"
                    />

                    <button
                      onClick={() => updateTotal(1)}
                      class="stepper-btn absolute right-2.5 z-10 w-[48px] h-[48px] rounded-[16px] font-extrabold text-2xl active:scale-95 transition-all duration-200 flex items-center justify-center shadow-md"
                    >
                      +
                    </button>
                  </div>
                </div>
              </div>



              {/* HERO ATTENDANCE RESULT DISPLAY */}
              <div class="card-inner p-8 sm:p-10 rounded-[24px] space-y-6 shadow-inner relative overflow-hidden">
                <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-6">
                  
                  {/* HERO PERCENTAGE & SUBTITLE */}
                  <div>
                    <span class="text-xs uppercase font-extrabold tracking-widest text-slate-400 block mb-1">Calculated Attendance</span>
                    <div class="text-6xl sm:text-7xl lg:text-8xl font-[900] tracking-[-0.04em] leading-none hero-pct my-1">
                      {stats.pct}%
                    </div>
                    <div class="text-lg sm:text-xl font-bold text-slate-300 mt-2 font-mono">
                      {stats.present} / {stats.total} Classes Attended
                    </div>
                  </div>

                  {/* STATUS BADGE */}
                  <div>
                    <span class={`px-5 py-2.5 rounded-full text-xs sm:text-sm font-black tracking-wider uppercase flex items-center gap-2 border ${
                      stats.status === 'safe'
                        ? 'bg-emerald-500/20 text-emerald-400 border-emerald-500/40 shadow-xl shadow-emerald-500/20'
                        : 'bg-red-500/20 text-red-400 border-red-500/40 shadow-xl shadow-red-500/20 animate-pulse'
                    }`}>
                      {stats.status === 'safe' ? '✅ SAFE ZONE' : '⚠️ LOW ATTENDANCE'}
                    </span>
                  </div>
                </div>

                {/* THICK ANIMATED GRADIENT PROGRESS BAR */}
                <div class="w-full bg-slate-800/80 rounded-full h-5 overflow-hidden p-1 border border-white/10 shadow-inner">
                  <div
                    class={`h-full rounded-full transition-all duration-700 ease-out ${
                      stats.pct >= targetGoal
                        ? 'bg-gradient-to-r from-blue-600 via-cyan-500 to-emerald-400 shadow-lg shadow-cyan-500/50'
                        : 'bg-gradient-to-r from-red-600 via-amber-500 to-yellow-400 shadow-lg shadow-red-500/50'
                    }`}
                    style={{ width: `${Math.min(100, stats.pct)}%` }}
                  ></div>
                </div>

                {/* SAFE BUNKS VS REQUIRED CLASSES BANNER */}
                <div class="p-5 sm:p-6 rounded-[20px] bg-white/5 border border-white/10 flex items-center justify-between text-sm sm:text-base">
                  {stats.status === 'safe' ? (
                    <div class="flex items-center gap-4 text-emerald-400 font-semibold">
                      <div class="w-12 h-12 rounded-2xl bg-emerald-500/20 border border-emerald-500/30 flex items-center justify-center text-emerald-400 shrink-0 shadow-lg">
                        <i data-lucide="shield-check" class="w-6 h-6"></i>
                      </div>
                      <div>
                        <div class="text-base sm:text-lg font-bold text-white">
                          You have <span class="text-emerald-400 text-xl font-black">{stats.safeBunks} safe bunks</span> left!
                        </div>
                        <div class="text-xs sm:text-sm text-slate-400 font-normal mt-0.5">
                          You can safely miss the next {stats.safeBunks} classes and stay above your {targetGoal}% goal.
                        </div>
                      </div>
                    </div>
                  ) : (
                    <div class="flex items-center gap-4 text-red-400 font-semibold">
                      <div class="w-12 h-12 rounded-2xl bg-red-500/20 border border-red-500/30 flex items-center justify-center text-red-400 shrink-0 shadow-lg">
                        <i data-lucide="alert-triangle" class="w-6 h-6"></i>
                      </div>
                      <div>
                        <div class="text-base sm:text-lg font-bold text-white">
                          Attend <span class="text-red-400 text-xl font-black">{stats.neededClasses} consecutive classes</span>!
                        </div>
                        <div class="text-xs sm:text-sm text-slate-400 font-normal mt-0.5">
                          Required to bring your attendance back up to the {targetGoal}% target threshold.
                        </div>
                      </div>
                    </div>
                  )}
                </div>
              </div>

              {/* WHAT-IF BUNK SIMULATOR SCENARIOS */}
              <div class="pt-4 border-t border-white/10 space-y-4">
                <h3 class="text-base font-bold flex items-center gap-2">
                  <i data-lucide="sliders" class="w-5 h-5 text-cyan-400"></i> What-If Bunk Simulator
                </h3>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 sm:gap-6">
                  
                  {/* SCENARIO 1: BUNKING NEXT N CLASSES */}
                  <div class="p-5 rounded-[20px] bg-white/5 border border-white/10 space-y-3 hover:border-cyan-500/30 transition-all duration-300">
                    <div class="flex justify-between items-center text-xs sm:text-sm">
                      <span class="font-bold text-slate-300">If you BUNK next N classes:</span>
                      <div class="flex items-center gap-1.5">
                        <button onClick={() => setSimBunks(Math.max(1, parseInt(simBunks) - 1))} class="stepper-btn w-7 h-7 rounded-xl font-bold text-xs flex items-center justify-center">-</button>
                        <span class="px-2 font-mono font-bold text-cyan-400 text-sm">{simBunks}</span>
                        <button onClick={() => setSimBunks(parseInt(simBunks) + 1)} class="stepper-btn w-7 h-7 rounded-xl font-bold text-xs flex items-center justify-center">+</button>
                      </div>
                    </div>

                    <div class="flex items-baseline justify-between text-xs sm:text-sm pt-2 border-t border-white/5">
                      <span class="text-slate-400">New Attendance %:</span>
                      <span class={`text-xl font-black ${afterBunkPct >= targetGoal ? 'text-emerald-400' : 'text-red-400'}`}>
                        {afterBunkPct}%
                      </span>
                    </div>
                  </div>

                  {/* SCENARIO 2: ATTENDING NEXT N CLASSES */}
                  <div class="p-5 rounded-[20px] bg-white/5 border border-white/10 space-y-3 hover:border-emerald-500/30 transition-all duration-300">
                    <div class="flex justify-between items-center text-xs sm:text-sm">
                      <span class="font-bold text-slate-300">If you ATTEND next N classes:</span>
                      <div class="flex items-center gap-1.5">
                        <button onClick={() => setSimAttends(Math.max(1, parseInt(simAttends) - 1))} class="stepper-btn w-7 h-7 rounded-xl font-bold text-xs flex items-center justify-center">-</button>
                        <span class="px-2 font-mono font-bold text-emerald-400 text-sm">{simAttends}</span>
                        <button onClick={() => setSimAttends(parseInt(simAttends) + 1)} class="stepper-btn w-7 h-7 rounded-xl font-bold text-xs flex items-center justify-center">+</button>
                      </div>
                    </div>

                    <div class="flex items-baseline justify-between text-xs sm:text-sm pt-2 border-t border-white/5">
                      <span class="text-slate-400">New Attendance %:</span>
                      <span class="text-xl font-black text-emerald-400">
                        {afterAttendPct}%
                      </span>
                    </div>
                  </div>

                </div>
              </div>

            </div>

          </main>

          {/* FOOTER */}
          <footer class="glass-navbar border-t py-6 px-6 text-center text-xs sm:text-sm text-slate-400 font-medium mt-8">
            &copy; 2026 Attendly &bull; Designed and Developed by <a href="https://github.com/lakshyap93" target="_blank" rel="noopener noreferrer" class="font-extrabold brand-title hover:opacity-80 transition-opacity duration-200">Lakshya Purohit</a>
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<AttendlyApp />);
  </script>

  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('[PWA] Service Worker registered:', reg.scope))
          .catch(err => console.warn('[PWA] Service Worker registration failed:', err));
      });
    }
  </script>
</body>
</html>
